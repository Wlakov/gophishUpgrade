{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">Phishing Scenarios</h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" onclick="edit(-1)" data-toggle="modal" data-backdrop="static" data-target="#modal">
            <i class="fa fa-plus"></i> New Scenario
        </button>
    </div>
    &nbsp;
    <div id="loading"><i class="fa fa-spinner fa-spin fa-4x"></i></div>
    <div id="emptyMessage" class="row" style="display:none;">
        <div class="alert alert-info">Create a scenario to combine an email template, landing page, and sending profile.</div>
    </div>
    <div class="row">
        <table id="scenariosTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email Template</th>
                    <th>Landing Page</th>
                    <th>Sending Profile</th>
                    <th>Last Modified</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="dismiss()"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="modalLabel">New Phishing Scenario</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <div class="form-group">
                    <label class="control-label" for="name">Name:</label>
                    <input type="text" class="form-control" placeholder="Scenario name" id="name" autofocus />
                </div>
                <div class="form-group">
                    <label class="control-label" for="template">Email Template:</label>
                    <select class="form-control" id="template"></select>
                </div>
                <div class="form-group">
                    <label class="control-label" for="page">Landing Page:</label>
                    <select class="form-control" id="page"></select>
                </div>
                <div class="form-group">
                    <label class="control-label" for="profile">Sending Profile:</label>
                    <select class="form-control" id="profile"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" data-dismiss="modal" class="btn btn-default" onclick="dismiss()">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save Scenario</button>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/dist/app/phishing_scenarios.min.js"></script>
{{end}}
